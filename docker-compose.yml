services:

  socket-proxy:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-tiny
    image: 11notes/socket-proxy@sha256:6806f9b3cfe64325ae2dc967381412e415d868c9542753962fd2e73f4f9686f1
    network_mode: none
    healthcheck:
      disable: true
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # The host runs Docker with userns-remap: default. The proxy needs host
    # userns to access the real Docker socket.
    userns_mode: host
    user: "0:988"
    # Docker remaps Traefik's container UID 1000 to host UID 101000. Own the
    # exported proxy socket by that host ID so Traefik can use Unix socket
    # permissions instead of the TCP Docker API proxy.
    environment:
      SOCKET_PROXY_UID: "101000"
      SOCKET_PROXY_GID: "101000"
    volumes:
      - /var/run/docker.sock:/run/docker.sock:ro
      - socket-proxy.run:/run/proxy

  traefik:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    cap_add:
      - NET_BIND_SERVICE
    image: traefik:latest
    cpu_shares: 2048
    user: "1000:1000"
    depends_on:
      socket-proxy:
        condition: service_started
    networks:
      - authelia_proxy
      - traefik_proxy
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:8082:8082
    volumes:
      - ./data:/etc/traefik:ro
      - /usr/local/share/ca-certificates/ipa-ca/CN=Docker Home Arpa Root CA 634702368810934143245700742467692493878270055232.crt:/run/mtls-ca/docker-root-ca.crt:ro
      - /usr/local/share/ca-certificates/ipa-ca/CN=Docker Home Arpa Intermediate CA 23079772591184115385777399826341917639265133410.crt:/run/mtls-ca/docker-intermediate-ca.crt:ro
      - socket-proxy.run:/var/run

    environment:
      - LAN_SUBNET
      - TRUSTED_WIFI_SUBNET
      - WG_SUBNET
      - IPV6_LAN_SUBNET
      - IPV6_TRUSTED_WIFI_SUBNET
      - IPV6_WG_SUBNET
    labels:
      - "checkmk_monitor=true"

networks:
  authelia_proxy:
    external: true
  traefik_proxy:
    external: true

volumes:
  socket-proxy.run:
