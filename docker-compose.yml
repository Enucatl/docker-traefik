services:

  socket-proxy:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-tiny
    image: 11notes/socket-proxy:2.1.7@sha256:6806f9b3cfe64325ae2dc967381412e415d868c9542753962fd2e73f4f9686f1
    network_mode: none
    healthcheck:
      disable: true
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # The host runs Docker with userns-remap: default. The proxy needs host
    # userns to access the real Docker socket.
    userns_mode: host
    user: "0:${DOCKER_SOCKET_GID:-982}"
    # Docker remaps Traefik's container UID 1000 to host UID 101000. Own the
    # exported proxy socket by that host ID so Traefik can use Unix socket
    # permissions instead of the TCP Docker API proxy.
    environment:
      SOCKET_PROXY_UID: "101000"
      SOCKET_PROXY_GID: "101000"
    volumes:
      - /var/run/docker.sock:/run/docker.sock:ro
      - socket-proxy.run:/run/proxy

  acme-init:
    image: ghcr.io/enucatl/traefik:latest
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    entrypoint: /bin/sh
    command: ["-ec", "chown 1000:1000 /acme && chmod 0700 /acme"]
    volumes:
      - acme:/acme

  traefik:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    cap_add:
      - NET_BIND_SERVICE
    image: ghcr.io/enucatl/traefik:latest
    cpu_shares: 2048
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "/traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      acme-init:
        condition: service_completed_successfully
      socket-proxy:
        condition: service_started
    networks:
      - airflow_traefik
      - authelia_traefik
      - backrest_traefik
      - beszel_traefik
      - browser-use_traefik
      - grafana-loki_traefik
      - grindr-api-dev-tool_traefik
      - infra_traefik
      - jellyfin_traefik
      - kms_traefik
      - open-grind_traefik
      - paperless-ai_traefik
      - qbittorrent_traefik
      - send-bills_traefik
      - unifi-network-application_traefik
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:8082:8082
    volumes:
      - ./data:/etc/traefik:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - /etc/ipa/ca.crt:/etc/ipa/ca.crt:ro
      - socket-proxy.run:/var/run
      - acme:/var/lib/traefik
    secrets:
      - cloudflare_dns_api_token

    environment:
      - DOCKER_DOMAIN
      - ACME_DOCKER_DOMAIN
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token
      - CLOUDFLARE_PROPAGATION_TIMEOUT=1800
      - LAN_SUBNET
      - TRUSTED_WIFI_SUBNET
      - CORTEX_SUBNET
      - WG_SUBNET
      - IPV6_LAN_SUBNET
      - IPV6_TRUSTED_WIFI_SUBNET
      - IPV6_CORTEX_SUBNET
      - IPV6_WG_SUBNET

networks:
  airflow_traefik:
    external: true
  authelia_traefik:
    external: true
  backrest_traefik:
    external: true
  beszel_traefik:
    external: true
  browser-use_traefik:
    external: true
  grafana-loki_traefik:
    external: true
  grindr-api-dev-tool_traefik:
    external: true
  infra_traefik:
    external: true
  jellyfin_traefik:
    external: true
  kms_traefik:
    external: true
  open-grind_traefik:
    external: true
  paperless-ai_traefik:
    external: true
  qbittorrent_traefik:
    external: true
  send-bills_traefik:
    external: true
  unifi-network-application_traefik:
    external: true

volumes:
  socket-proxy.run:
  acme:

secrets:
  cloudflare_dns_api_token:
    file: ./secrets/cloudflare_dns_api_token
