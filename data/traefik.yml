accessLog:
  format: json
  fields:
    queryParameters:
      defaultMode: drop
api:
  dashboard: true
  insecure: false

ping:
  entryPoint: ping

entryPoints:
  http:
    address: ":80"
    http:
      underscoreHeadersStrategy: reject
      middlewares:
        - public-rate-limit@file
        - security-headers@file
  https:
    address: ":443"
    http:
      underscoreHeadersStrategy: reject
      middlewares:
        - public-rate-limit@file
        - security-headers@file
  ping:
    address: ":8082"
  protonmail-bridge-imap:
    address: ":1243"
  protonmail-bridge-smtp:
    address: ":1125"
  postgres:
    address: ":5432"
  checkmk:
    address: ":8000"

log:
  level: INFO
  format: json

global:
  checkNewVersion: false
  sendAnonymousUsage: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik
    watch: true

serversTransport:
  rootCAs:
    - /run/mtls-ca/docker-root-ca.crt
    - /run/mtls-ca/docker-intermediate-ca.crt
