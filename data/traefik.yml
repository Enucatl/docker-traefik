accessLog:
  format: json
  fields:
    queryParameters:
      defaultMode: drop
api:
  dashboard: true
  insecure: false

ping:
  entryPoint: ping

entryPoints:
  http:
    address: ":80"
    http:
      underscoreHeadersStrategy: reject
      middlewares:
        - public-rate-limit@file
        - security-headers@file
  https:
    address: ":443"
    http:
      underscoreHeadersStrategy: reject
      middlewares:
        - security-headers@file
  ping:
    address: ":8082"
  protonmail-bridge-imap:
    address: ":1243"
  protonmail-bridge-smtp:
    address: ":1125"
  postgres:
    address: ":5432"

log:
  level: INFO
  format: json

global:
  checkNewVersion: false
  sendAnonymousUsage: false

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik
    watch: true

serversTransport:
  rootCAs:
    - /etc/ssl/certs/ca-certificates.crt

certificatesResolvers:
  cloudflare:
    acme:
      storage: /var/lib/traefik/acme.json
      keyType: EC256
      dnsChallenge:
        provider: cloudflare
        propagation:
          # Authoritative DNS over IPv6 is unreachable here; verify both public recursors.
          disableANSChecks: true
          requireAllRNS: true
        # Internal split DNS must not hide the public challenge records.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
